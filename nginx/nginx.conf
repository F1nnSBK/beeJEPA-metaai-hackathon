worker_processes auto;
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Compress JSON state, embeddings, and SVG mosaics over the virtual network
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream beejepa_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name beejepa.finn-hertsch.de raspi.local localhost _;

        client_max_body_size 32m;

        # Serve root index.html directly via Nginx if present on SSD with 0ms overhead
        location = / {
            root /mnt/ssd/beejepa_data/static;
            try_files /index.html @backend;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        }

        # Serve static UI assets, mosaics & SVGs zero-copy from SSD, otherwise fall back to backend JAR
        location /static/ {
            alias /mnt/ssd/beejepa_data/static/;
            try_files $uri @backend;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        }

        # Live-state WebSocket proxy (/ws) for Cloudflare Tunnel & LAN HITL clients
        location /ws {
            proxy_pass http://beejepa_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Low-latency tile PNG & API routes
        location / {
            proxy_pass http://beejepa_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location @backend {
            proxy_pass http://beejepa_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
