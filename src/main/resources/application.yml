micronaut:
  application:
    name: beeJEPA
  server:
    port: ${PORT:8080}
    thread-selection: AUTO
    cors:
      enabled: true
  router:
    static-resources:
      frontend:
        paths: classpath:public
        mapping: /**

meta:
  muse:
    base-url: ${META_MUSE_BASE_URL:https://api.meta.ai}
    api-key: ${META_MUSE_API_KEY:default_mock_key}
    timeout: ${META_MUSE_TIMEOUT:30s}

baseten:
  api-key: ${BASETEN_API_KEY:}
  base-url: ${BASETEN_BASE_URL:https://inference.baseten.co/v1}
  model: ${BASETEN_MUSE_MODEL:meta-models/muse-spark-open}
  timeout: ${BASETEN_TIMEOUT:30s}
  allow-inference-calls: ${BASETEN_ALLOW_INFERENCE:false}

beejepa:
  data:
    path: ${BEEJEPA_DATA_PATH:./data}
    require-symlink: ${BEEJEPA_REQUIRE_SYMLINK:false}
  sqlite:
    filename: state.db
    busy-timeout-ms: 5000

endpoints:
  health:
    enabled: true
    sensitive: false
  info:
    enabled: true
    sensitive: false
