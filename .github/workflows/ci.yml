name: CI Pipeline (Build UI, JUnit 5 Suite & Raspberry Pi ARM64 Bundle)

on:
  push:
    branches:
      - main
      - feat/java25-sam-muse-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build UI, Run JUnit 5 Tests & Package Shadow JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x build_ui.sh

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build Vue 3 SPA & Sync to Micronaut Public Resources
        run: ./build_ui.sh

      - name: Bootstrap Real Hugging Face Video Clips for JUnit 5 Suite
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p data/hackathon_sample/event_clips data/hackathon_sample/sequences
          cp deploy/manifest.json data/hackathon_sample/manifest.json
          curl -fsSL "https://huggingface.co/datasets/F1nnSBK/bee-jepa-entrance-anomalies/resolve/main/events/peaks/evt_rec2125_seq000_f0000.mp4" \
            -o data/hackathon_sample/event_clips/evt_rec2125_seq000_f0000.mp4
          curl -fsSL "https://huggingface.co/datasets/F1nnSBK/bee-jepa-entrance-anomalies/resolve/main/stitched_sequences/full_rec2125_seq000_9x9_stitched_30s.mp4" \
            -o data/hackathon_sample/sequences/clip_00_rec2125_seq000_00_00_to_00_30.mp4

      - name: Run JUnit 5 Verification Suite
        run: ./gradlew test

      - name: Build Executable Shadow JAR for Raspberry Pi
        run: ./gradlew shadowJar -x test

      - name: Upload Raspberry Pi Release JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beejepa-raspi-release
          path: |
            build/libs/*-all.jar
            src/main/resources/public/
            Dockerfile
            docker-compose.yml
            deploy/
          retention-days: 7

  deploy-raspberry-pi:
    name: Deploy to Raspberry Pi (Self-Hosted ARM64)
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/java25-sam-muse-pipeline'))
    runs-on: [self-hosted, linux, arm64]

    steps:
      - name: Download Raspberry Pi Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: beejepa-raspi-release
          path: release-bundle

      - name: Deploy Prebuilt Bundle & Reload Nginx on Raspberry Pi
        run: |
          set -euo pipefail
          REMOTE_DIR="/home/finn/beejepa-raspi"
          SSD_DATA_DIR="/mnt/onlypits/beeJEPA"
          EXT4_STATE_DIR="/mnt/onlypits-ext4/beejepa"

          chmod 755 /home/finn
          mkdir -p "${REMOTE_DIR}/public"
          sudo mkdir -p "${EXT4_STATE_DIR}/sqlite" "${EXT4_STATE_DIR}/redis"
          sudo chown -R finn:finn "${EXT4_STATE_DIR}"
          ln -sfn "${SSD_DATA_DIR}" "${REMOTE_DIR}/data"

          cp release-bundle/build/libs/*-all.jar "${REMOTE_DIR}/beeJEPA-all.jar"
          cp release-bundle/Dockerfile release-bundle/docker-compose.yml "${REMOTE_DIR}/"
          rm -rf "${REMOTE_DIR}/public/"*
          cp -r release-bundle/src/main/resources/public/* "${REMOTE_DIR}/public/"
          cp release-bundle/deploy/manifest.json "${SSD_DATA_DIR}/hackathon_sample/manifest.json"
          cp release-bundle/deploy/beejepa-raspi-nginx.conf "${REMOTE_DIR}/beejepa-raspi-nginx.conf"

          cd "${REMOTE_DIR}"
          BEEJEPA_DOCKER_TARGET=prebuilt-runtime \
          BEEJEPA_HOST_DATA_DIR="${SSD_DATA_DIR}" \
          BEEJEPA_HOST_SQLITE_DIR="${EXT4_STATE_DIR}/sqlite" \
          docker compose up -d --build --remove-orphans

          sudo cp "${REMOTE_DIR}/beejepa-raspi-nginx.conf" /etc/nginx/sites-available/beejepa
          sudo ln -sfn /etc/nginx/sites-available/beejepa /etc/nginx/sites-enabled/beejepa
          sudo rm -f /etc/nginx/sites-enabled/onlypits /etc/nginx/sites-enabled/default /etc/nginx/sites-available/onlypits
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Verify Live Raspberry Pi Health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/v1/ping && break || sleep 1
          done
          echo ""
          curl -fsS http://127.0.0.1:8080/api/v1/muse/status
          echo ""
          curl -fsS http://127.0.0.1/api/v1/ping
          echo ""

