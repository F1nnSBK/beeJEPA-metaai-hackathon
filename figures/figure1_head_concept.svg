<?xml version="1.0" encoding="UTF-8"?>
<svg id="figure1-root" width="1200" height="450" version="1.1" viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <style type="text/css">text { font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: normal; }
      .math-text { font-family: "Fira Math", "STIX Two Math", math, sans-serif; font-weight: normal; }
      .stage-num { font-size: 11px; fill: #64748b; letter-spacing: 0.5px; }
      .stage-title { font-size: 13px; fill: #0f172a; text-anchor: middle; }
      .bio-label { font-size: 11px; fill: #92400e; text-anchor: middle; }
      .comp-label { font-size: 11.5px; fill: #1e293b; text-anchor: middle; }
      .metric-pill { font-size: 10.5px; fill: #334155; text-anchor: middle; }
      .axis-tag { font-size: 10.5px; fill: #dc2626; }
      .small-tag { font-size: 9.5px; fill: #475569; text-anchor: middle; }</style>
  <marker id="arrow-flow" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
   <path d="m0 1 6 2.5-6 2.5z" fill="#64748b"/>
  </marker>
  <marker id="arrow-amber" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
   <path d="m0 1 6 2.5-6 2.5z" fill="#d97706"/>
  </marker>
  <marker id="arrow-red" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
   <path d="m0 1 6 2.5-6 2.5z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-iso" markerHeight="5" markerWidth="5" orient="auto" refX="4" refY="2.5">
   <path d="m0 0.5 4.5 2-4.5 2z" fill="#94a3b8"/>
  </marker>
 </defs>
 <!-- Clean White Canvas -->
 <rect id="bg" width="1200" height="450" fill="#fff"/>
 <!-- Left Row Track Indicators (Biology vs. Computation) -->
 <g id="row-indicators">
  <rect x="16" y="46" width="26" height="106" rx="5" fill="#fffbeb" stroke="#fde68a"/>
  <text transform="rotate(-90 29 99)" x="29" y="99" fill="#b45309" font-size="10" text-anchor="middle">BIOLOGY</text>
  <rect x="16" y="176" width="26" height="248" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text transform="rotate(-90 29 300)" x="29" y="300" fill="#1e40af" font-size="10" text-anchor="middle">beeJEPA</text>
 </g>
 <!-- ===================================================================== -->
 <!-- STAGE 1: PERIPHERAL PREDICTION (V-JEPA 2.1 9x9 Grid)                  -->
 <!-- ===================================================================== -->
 <g id="stage-1" transform="translate(56 18)">
  <text class="stage-title" x="125" y="14">1. Peripheral Stream</text>
  <!-- Top: Biological Compound Eye & Wide Optic Flow -->
  <rect y="28" width="250" height="106" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <!-- Hexagonal Ommatidia Dome -->
  <g transform="translate(58 50)" fill="#fef3c7" stroke="#d97706" stroke-width="1.1">
   <polygon points="12 0 24 6 24 18 12 24 0 18 0 6"/>
   <polygon points="36 0 48 6 48 18 36 24 24 18 24 6"/>
   <polygon points="24 18 36 24 36 36 24 42 12 36 12 24" fill="#fde68a"/>
   <polygon points="0 18 12 24 12 36 0 42 -12 36 -12 24"/>
   <polygon points="48 18 60 24 60 36 48 42 36 36 36 24"/>
  </g>
  <!-- Wide Field Rays -->
  <line x1="125" x2="195" y1="68" y2="48" stroke="#f59e0b" stroke-dasharray="3,2" stroke-width="1.2"/>
  <line x1="125" x2="202" y1="72" y2="72" stroke="#d97706" stroke-width="1.4"/>
  <line x1="125" x2="195" y1="76" y2="96" stroke="#cbd5e1" stroke-dasharray="3,2" stroke-width="1.2"/>
  <text class="bio-label" x="125" y="122">Ommatidia Optic Flow</text>
  <!-- Vertical Isomorphism Connector -->
  <line x1="125" x2="125" y1="136" y2="154" marker-end="url(#arrow-iso)" stroke="#94a3b8" stroke-dasharray="2,2" stroke-width="1.2"/>
  <!-- Bottom: Computational 60fps Frame + 9x9 Tubelet Grid -->
  <rect y="158" width="250" height="248" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- Visual Camera Frame (144x144) -->
  <g transform="translate(53 174)">
   <!-- Background sky/hive -->
   <rect width="144" height="144" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
   <!-- Wooden flight board band -->
   <rect x="2" y="64" width="140" height="36" fill="#fde68a" opacity=".75"/>
   <!-- Entrance slot -->
   <rect x="44" y="76" width="56" height="10" rx="2" fill="#475569"/>
   <!-- Grass zone at bottom (faded / ignored by V-JEPA) -->
   <rect x="2" y="100" width="140" height="42" fill="#dcfce7" opacity=".45"/>
   <path d="m18 140 4-14m16 14-4-12m32 12 4-13m32 13-4-12m26 12 4-14" stroke="#94a3b8" stroke-width="1.2"/>
   <!-- Bees on board -->
   <ellipse cx="32" cy="82" rx="4" ry="2.5" fill="#d97706"/>
   <ellipse cx="64" cy="80" rx="4" ry="2.5" fill="#d97706"/>
   <ellipse cx="72" cy="84" rx="4" ry="2.5" fill="#d97706"/>
   <ellipse cx="80" cy="79" rx="4" ry="2.5" fill="#d97706"/>
   <ellipse cx="112" cy="83" rx="4" ry="2.5" fill="#d97706"/>
   <!-- 9x9 Latent Grid Overlay (drawn at 16px intervals) -->
   <g opacity=".65" stroke="#94a3b8" stroke-width=".5">
    <line x1="16" x2="16" y2="144"/>
    <line x1="32" x2="32" y2="144"/>
    <line x1="48" x2="48" y2="144"/>
    <line x1="64" x2="64" y2="144"/>
    <line x1="80" x2="80" y2="144"/>
    <line x1="96" x2="96" y2="144"/>
    <line x1="112" x2="112" y2="144"/>
    <line x1="128" x2="128" y2="144"/>
    <line x2="144" y1="16" y2="16"/>
    <line x2="144" y1="32" y2="32"/>
    <line x2="144" y1="48" y2="48"/>
    <line x2="144" y1="64" y2="64"/>
    <line x2="144" y1="80" y2="80"/>
    <line x2="144" y1="96" y2="96"/>
    <line x2="144" y1="112" y2="112"/>
    <line x2="144" y1="128" y2="128"/>
   </g>
   <!-- Highlighted Tubelet Hotspot (4,2) -->
   <rect x="56" y="68" width="32" height="24" fill="#ef4444" fill-opacity=".28" stroke="#dc2626" stroke-width="1.6"/>
  </g>
  <text class="comp-label" x="125" y="342">V-JEPA <tspan class="math-text" font-family="Fira Math">2.1</tspan> (ViT-B/<tspan class="math-text" font-family="Fira Math">16</tspan> · <tspan class="math-text" font-family="Fira Math">43×43</tspan>)</text>
  <rect x="28" y="356" width="194" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="metric-pill" x="125" y="372"><tspan class="math-text" font-family="Fira Math">60</tspan> fps · <tspan class="math-text" font-family="Fira Math">2,688</tspan> windows</text>
 </g>
 <!-- Stage 1 -> Stage 2 Arrow -->
 <line x1="312" x2="334" y1="260" y2="260" marker-end="url(#arrow-flow)" stroke="#64748b" stroke-width="1.6"/>
 <!-- ===================================================================== -->
 <!-- STAGE 2: LATENT SURPRISE & SACCADIC GATING                            -->
 <!-- ===================================================================== -->
 <g id="stage-2" transform="translate(342 18)">
  <text class="stage-title" x="125" y="14">2. Surprise Trigger</text>
  <!-- Top: Biological Saccadic Turn -->
  <rect y="28" width="250" height="106" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <!-- Bee Eye + Fast Saccade Arc to Target -->
  <circle cx="68" cy="76" r="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <circle cx="74" cy="72" r="5" fill="#b45309"/>
  <path d="m92 68q42-30 80-4" fill="none" marker-end="url(#arrow-amber)" stroke="#d97706" stroke-width="2"/>
  <!-- Target Reticle -->
  <circle cx="184" cy="74" r="12" fill="none" stroke="#dc2626" stroke-dasharray="3,2" stroke-width="1.4"/>
  <circle cx="184" cy="74" r="3" fill="#dc2626"/>
  <text class="bio-label" x="125" y="122">Retinal Slip Saccade</text>
  <!-- Vertical Isomorphism Connector -->
  <line x1="125" x2="125" y1="136" y2="154" marker-end="url(#arrow-iso)" stroke="#94a3b8" stroke-dasharray="2,2" stroke-width="1.2"/>
  <!-- Bottom: Surprise Curve S(t) + Frame Funnel -->
  <rect y="158" width="250" height="248" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- Mini Tufte Surprise Plot -->
  <g transform="translate(24 178)">
   <!-- Axes -->
   <line x2="202" y1="96" y2="96" stroke="#64748b"/>
   <line y1="10" y2="96" stroke="#64748b"/>
   <!-- Threshold line tau (P99) -->
   <line x2="202" y1="52" y2="52" stroke="#dc2626" stroke-dasharray="4,3" stroke-width="1.1"/>
   <text class="axis-tag math-text" x="8" y="45" fill="#dc2626" font-family="Fira Math">τ (P99)</text>
   <!-- Surprise Curve S(t) -->
   <path d="m4 84 20-4 20 3 20-5 16 4 16-68 16 65 20 3 22-50 16 49 26 2" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2"/>
   <!-- Peak Markers -->
   <circle cx="96" cy="14" r="4.5" fill="#dc2626"/>
   <circle cx="154" cy="32" r="3.5" fill="#f59e0b"/>
   <text class="axis-tag math-text" x="106" y="16" fill="#dc2626" font-family="Fira Math">16.05</text>
  </g>
  <!-- Visual Frame Filtering Funnel (Many grey frames -> 1 active peak frame) -->
  <g transform="translate(45 290)">
   <rect y="2" width="18" height="22" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
   <rect x="10" y="2" width="18" height="22" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
   <rect x="20" y="2" width="18" height="22" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
   <rect x="30" y="2" width="18" height="22" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
   <line x1="58" x2="94" y1="13" y2="13" marker-end="url(#arrow-red)" stroke="#dc2626" stroke-width="1.5"/>
   <rect x="104" width="24" height="26" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
   <circle cx="116" cy="13" r="4" fill="#dc2626"/>
  </g>
  <text class="comp-label" x="125" y="342">Token-<tspan class="math-text" font-family="Fira Math">Δ</tspan> Trajectory</text>
  <rect x="28" y="356" width="194" height="24" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text class="metric-pill" x="125" y="372" fill="#991b1b"><tspan class="math-text" font-family="Fira Math">−93.2%</tspan> windows (<tspan class="math-text" font-family="Fira Math">184</tspan> peaks)</text>
 </g>
 <!-- Stage 2 -> Stage 3 Arrow -->
 <line x1="598" x2="620" y1="260" y2="260" marker-end="url(#arrow-flow)" stroke="#64748b" stroke-width="1.6"/>
 <!-- ===================================================================== -->
 <!-- STAGE 3: FOVEAL ZOOM & SAM 3.1 + IoA ISOLATION                        -->
 <!-- ===================================================================== -->
 <g id="stage-3" transform="translate(628 18)">
  <text class="stage-title" x="125" y="14">3. Foveal Grounding</text>
  <!-- Top: Biological Acute Zone Inspection -->
  <rect y="28" width="250" height="106" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <!-- Zoom Lens on Dense Bee Cluster -->
  <circle cx="125" cy="72" r="28" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <!-- High-acuity bee silhouettes inside lens -->
  <ellipse cx="116" cy="68" rx="6" ry="3.5" fill="#b45309"/>
  <ellipse cx="132" cy="66" rx="6" ry="3.5" fill="#b45309"/>
  <ellipse cx="124" cy="79" rx="6" ry="3.5" fill="#b45309"/>
  <!-- Crosshair ticks on lens -->
  <line x1="92" x2="100" y1="72" y2="72" stroke="#d97706" stroke-width="1.3"/>
  <line x1="150" x2="158" y1="72" y2="72" stroke="#d97706" stroke-width="1.3"/>
  <line x1="125" x2="125" y1="39" y2="47" stroke="#d97706" stroke-width="1.3"/>
  <line x1="125" x2="125" y1="97" y2="105" stroke="#d97706" stroke-width="1.3"/>
  <text class="bio-label" x="125" y="122">Frontal Acute Zone</text>
  <!-- Vertical Isomorphism Connector -->
  <line x1="125" x2="125" y1="136" y2="154" marker-end="url(#arrow-iso)" stroke="#94a3b8" stroke-dasharray="2,2" stroke-width="1.2"/>
  <!-- Bottom: 384x384 Foveal Crop + SAM 3.1 Ch.1/Ch.2 + IoA >= 0.25 -->
  <rect y="158" width="250" height="248" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- Zoomed 384x384 Foveal Canvas (144x144) -->
  <g transform="translate(53 174)">
   <rect width="144" height="144" rx="4" fill="#fef3c7" stroke="#64748b" stroke-width="1.2"/>
   <!-- Dark Hive Entrance Slot -->
   <rect x="20" y="54" width="104" height="22" rx="3" fill="#334155"/>
   <!-- Outer Board Bees (Ch.1 muted green boxes, outside hotspot) -->
   <rect x="8" y="22" width="20" height="14" fill="none" stroke="#64748b" stroke-dasharray="2,2" stroke-width="1.1"/>
   <ellipse cx="18" cy="29" rx="6" ry="3.5" fill="#94a3b8"/>
   <rect x="114" y="24" width="20" height="14" fill="none" stroke="#64748b" stroke-dasharray="2,2" stroke-width="1.1"/>
   <ellipse cx="124" cy="31" rx="6" ry="3.5" fill="#94a3b8"/>
   <rect x="10" y="114" width="20" height="14" fill="none" stroke="#64748b" stroke-dasharray="2,2" stroke-width="1.1"/>
   <ellipse cx="20" cy="121" rx="6" ry="3.5" fill="#94a3b8"/>
   <!-- Red Hotspot Box (Ch.2 PVS) -->
   <rect x="24" y="36" width="96" height="72" fill="#ef4444" fill-opacity=".1" stroke="#dc2626" stroke-width="1.8"/>
   <!-- Contained Hotspot Bees (IoA >= 0.25, bright emerald boxes) -->
   <g fill="#10b981" fill-opacity=".22" stroke="#059669" stroke-width="1.5">
    <rect x="30" y="44" width="22" height="16"/>
    <rect x="56" y="42" width="22" height="16"/>
    <rect x="84" y="46" width="22" height="16"/>
    <rect x="36" y="66" width="22" height="16"/>
    <rect x="64" y="68" width="22" height="16"/>
    <rect x="90" y="66" width="22" height="16"/>
    <rect x="48" y="86" width="22" height="16"/>
    <rect x="76" y="86" width="22" height="16"/>
   </g>
   <!-- Bee centers inside hotspot -->
   <g fill="#047857">
    <ellipse cx="41" cy="52" rx="6" ry="3.2"/>
    <ellipse cx="67" cy="50" rx="6" ry="3.2"/>
    <ellipse cx="95" cy="54" rx="6" ry="3.2"/>
    <ellipse cx="47" cy="74" rx="6" ry="3.2"/>
    <ellipse cx="75" cy="76" rx="6" ry="3.2"/>
    <ellipse cx="101" cy="74" rx="6" ry="3.2"/>
    <ellipse cx="59" cy="94" rx="6" ry="3.2"/>
    <ellipse cx="87" cy="94" rx="6" ry="3.2"/>
   </g>
  </g>
  <text class="comp-label" x="125" y="342">SAM <tspan class="math-text" font-family="Fira Math">3.1</tspan> + <tspan class="math-text" font-family="Fira Math">IoA ≥ 0.25</tspan></text>
  <rect x="20" y="356" width="210" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text class="metric-pill" x="125" y="372" fill="#065f46"><tspan class="math-text" font-family="Fira Math">+8.3×</tspan> Fovea · <tspan class="math-text" font-family="Fira Math">15/38</tspan> Bees</text>
 </g>
 <!-- Stage 3 -> Stage 4 Arrow -->
 <line x1="884" x2="906" y1="260" y2="260" marker-end="url(#arrow-flow)" stroke="#64748b" stroke-width="1.6"/>
 <!-- ===================================================================== -->
 <!-- STAGE 4: CAUSAL SYNTHESIS & DUAL OUTPUT (<REPORT> + <SPOKEN>)         -->
 <!-- ===================================================================== -->
 <g id="stage-4" transform="translate(914 18)">
  <text class="stage-title" x="125" y="14">4. Dual Synthesis</text>
  <!-- Top: Biological Waggle Dance Communication -->
  <rect y="28" width="250" height="106" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <!-- Figure-8 Waggle Path -->
  <path d="m85 72c-25-26-25 26 0 0s55 26 80 0 25 26 0 0-55 26-80 0z" fill="none" stroke="#d97706" stroke-dasharray="3,2" stroke-width="1.5"/>
  <path d="m102 72 8-6 8 12 8-12 8 12 8-6" fill="none" stroke="#b45309" stroke-width="2"/>
  <text class="bio-label" x="125" y="122">Waggle Dance Vector</text>
  <!-- Vertical Isomorphism Connector -->
  <line x1="125" x2="125" y1="136" y2="154" marker-end="url(#arrow-iso)" stroke="#94a3b8" stroke-dasharray="2,2" stroke-width="1.2"/>
  <!-- Bottom: Muse Spark Open -> <REPORT> Card + <SPOKEN> Waveform -->
  <rect y="158" width="250" height="248" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- Visual Card 1: <REPORT> UI Digest -->
  <g transform="translate(22 174)">
   <rect width="206" height="68" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
   <!-- 3 mini keyframe thumbnails (00:00, 00:20, 00:35) -->
   <rect x="12" y="12" width="28" height="28" rx="3" fill="#fef2f2" stroke="#dc2626"/>
   <circle cx="26" cy="26" r="6" fill="#10b981"/>
   <rect x="46" y="12" width="28" height="28" rx="3" fill="#fffbeb" stroke="#f59e0b"/>
   <circle cx="60" cy="26" r="5" fill="#10b981"/>
   <rect x="80" y="12" width="28" height="28" rx="3" fill="#ecfdf5" stroke="#10b981"/>
   <circle cx="94" cy="26" r="4" fill="#10b981"/>
   <!-- Clean visual lines representing concise brief -->
   <line x1="120" x2="190" y1="16" y2="16" stroke="#334155" stroke-linecap="round" stroke-width="2.5"/>
   <line x1="120" x2="178" y1="26" y2="26" stroke="#94a3b8" stroke-linecap="round" stroke-width="2"/>
   <line x1="120" x2="166" y1="36" y2="36" stroke="#94a3b8" stroke-linecap="round" stroke-width="2"/>
   <text class="small-tag" x="103" y="57" fill="#0f172a">&lt;REPORT&gt; Visual Digest</text>
  </g>
  <!-- Visual Card 2: <SPOKEN> Acoustic Stream -->
  <g transform="translate(22 252)">
   <rect width="206" height="68" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
   <!-- Acoustic Waveform Bars -->
   <g stroke="#2563eb" stroke-linecap="round" stroke-width="2.6">
    <line x1="28" x2="28" y1="24" y2="32"/>
    <line x1="40" x2="40" y1="18" y2="38"/>
    <line x1="52" x2="52" y1="12" y2="44"/>
    <line x1="64" x2="64" y1="20" y2="36"/>
    <line x1="76" x2="76" y1="14" y2="42"/>
    <line x1="88" x2="88" y1="22" y2="34"/>
    <line x1="100" x2="100" y1="10" y2="46"/>
    <line x1="112" x2="112" y1="16" y2="40"/>
    <line x1="124" x2="124" y1="22" y2="34"/>
    <line x1="136" x2="136" y1="14" y2="42"/>
    <line x1="148" x2="148" y1="19" y2="37"/>
    <line x1="160" x2="160" y1="24" y2="32"/>
    <line x1="172" x2="172" y1="26" y2="30"/>
   </g>
   <text class="small-tag" x="103" y="57" fill="#0f172a">&lt;SPOKEN&gt; Natural Audio</text>
  </g>
  <text class="comp-label" x="125" y="342">Muse Spark Open</text>
  <rect x="28" y="356" width="194" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="metric-pill" x="125" y="372"><tspan class="math-text" font-family="Fira Math">3</tspan> Keyframes · Dual Output</text>
 </g>
</svg>
