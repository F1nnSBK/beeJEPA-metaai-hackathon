map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream beejepa_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name beejepa.finn-hertsch.de raspi.local localhost _;

    server_tokens off;
    access_log off;
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;

    # Zero-copy MP4 sequence streaming from external SSD (/mnt/onlypits/beeJEPA)
    location /api/v1/sequences/ {
        root /mnt/onlypits/beeJEPA;
        rewrite ^/api/v1/sequences/(.*)$ /$1 break;
        try_files /stitched_sequences$uri /hackathon_sample/sequences$uri @backend;
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
    }

    # API & Actuator endpoints proxied to Micronaut 4.7 / Java 25 backend
    location /api/ {
        proxy_pass http://beejepa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /prometheus {
        proxy_pass http://beejepa_backend/prometheus;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Vue 3 SPA static assets served directly by Nginx
    location / {
        root /home/finn/beejepa-raspi/public;
        try_files $uri $uri/ /index.html @backend;
        add_header Cache-Control "no-cache";
    }

    location @backend {
        proxy_pass http://beejepa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
